<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - Evidencia SENA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .login-header {
            background: linear-gradient(135deg, #2b5876, #4e4376);
            color: white;
        }
        .card-custom {
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card card-custom h-100">
                    <div class="card-header login-header p-4 text-center border-0 rounded-top">
                        <h3 class="mb-0 fw-bold">🔒 Iniciar Sesión</h3>
                    </div>
                    <div class="card-body p-4">
                        <form action="LoginServlet" method="POST">
                            <div class="mb-3">
                                <label for="correo" class="form-label fw-semibold">Correo Electrónico:</label>
                                <input type="email" class="form-control" id="correo" name="correo" required placeholder="ejemplo@correo.com">
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold">Contraseña:</label>
                                <input type="password" class="form-control" id="password" name="password" required placeholder="********">
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Ingresar al Sistema</button>
                        </form>
                    </div>
                </div>
                
                <div class="text-center mt-4 text-secondary">
                    <p class="small">Desarrollado por <strong>Maira Morales</strong> | EVAD SENA 2026</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
