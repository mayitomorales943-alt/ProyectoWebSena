<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Evidencia SENA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .header-registro {
            background: linear-gradient(135deg, #134e5e, #71b280);
            color: white;
        }
        .header-modulo {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: white;
        }
        .card-custom {
            border: none;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.06);
        }
    </style>
</head>
<body>

    <div class="container my-5">
        <div class="row justify-content-center g-4">
            
            <div class="col-md-6">
                <div class="card card-custom h-100">
                    <div class="card-header header-registro p-4 text-center border-0 rounded-top">
                        <h2 class="mb-0 fw-bold">Registro de Usuarios</h2>
                    </div>
                    <div class="card-body p-4">
                        <form action="RegistroServlet" method="POST">
                            <div class="mb-3">
                                <label for="nombre" class="form-label fw-semibold">Nombre Completo:</label>
                                <input type="text" class="form-control" id="nombre" name="nombre" required placeholder="Ej. Maira Morales">
                            </div>
                            <div class="mb-3">
                                <label for="correo" class="form-label fw-semibold">Correo Electrónico:</label>
                                <input type="email" class="form-control" id="correo" name="correo" required placeholder="maira@correo.com">
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold">Contraseña para el usuario:</label>
                                <input type="password" class="form-control" id="password" name="password" required placeholder="Crea una contraseña">
                            </div>
                            <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Enviar Datos</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-5">
                <div class="card card-custom h-100 d-flex flex-column justify-content-between">
                    <div>
                        <div class="card-header header-modulo p-4 text-center border-0 rounded-top">
                            <h2 class="mb-0 fw-bold">Módulo CRUD</h2>
                        </div>
                        <div class="card-body p-4 text-center">
                            <div class="fs-1 mb-2">🔄</div>
                            <h4 class="fw-semibold">Actualización de Datos</h4>
                            <p class="text-muted mt-3">
                                ¿Necesitas corregir la información de un usuario existente? Accede a nuestro panel de edición para buscar por ID y modificar los registros guardados en MySQL.
                            </p>
                        </div>
                    </div>
                    <div class="p-4 mt-auto">
                        <a href="actualizar.jsp" class="btn btn-primary w-100 py-2 fw-bold">Ir a Actualizar Datos</a>
                    </div>
                </div>
            </div>

        </div>

        <div class="text-center mt-5 text-secondary">
            <p class="small">Desarrollado por: <strong>Maira Morales</strong> | EVAD SENA 2026</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
